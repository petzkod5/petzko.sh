name: Security rescan

# A CVE disclosed after an image is built won't show up at build time. This
# re-scans the currently published image weekly so newly-disclosed
# vulnerabilities surface (in the run log) even with no code changes.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-rescan:
    name: Trivy image rescan
    runs-on: ubuntu-latest
    steps:
      - name: Scan published image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e GITHUB_TOKEN \
            ghcr.io/aquasecurity/trivy:latest image \
            ghcr.io/petzkod5/petzko-sh:latest \
            --severity CRITICAL,HIGH --exit-code 0 --no-progress
