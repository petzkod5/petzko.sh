name: CI

# Validation that must pass before code reaches a release. Runs on PRs and on
# direct pushes to main (the repo's workflow), so nothing ships unchecked.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  backend:
    name: Go vet & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          # Stdlib-only module — no go.sum to key the cache on.
          cache: false
      - run: go vet ./...
      - run: go build ./...

  chart:
    name: Helm lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Lint
        run: |
          helm lint charts/petzko-sh -f charts/petzko-sh/values-staging.yaml
          helm lint charts/petzko-sh -f charts/petzko-sh/values-prod.yaml
      - name: Template (render both overlays)
        run: |
          helm template petzko-sh charts/petzko-sh -f charts/petzko-sh/values-staging.yaml >/dev/null
          helm template petzko-sh charts/petzko-sh -f charts/petzko-sh/values-prod.yaml >/dev/null

  dockerfile:
    name: Dockerfile lint (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          # Only fail on errors; style warnings are surfaced but non-blocking.
          failure-threshold: error

  scan:
    name: Trivy (deps, Dockerfile, manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        # Run Trivy from its official image (ghcr) instead of the install-based
        # action, whose binary download is flaky. Findings print to the run log;
        # report-only for now — raise --exit-code to 1 to enforce once the
        # baseline is clean. (Repo is private, so the Security tab / SARIF upload
        # would need GitHub Advanced Security.)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e GITHUB_TOKEN -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/aquasecurity/trivy:latest fs /repo \
            --scanners vuln,misconfig,secret \
            --severity CRITICAL,HIGH \
            --exit-code 0 --no-progress

  image:
    name: Build & scan image (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # Build the real container (validates the Dockerfile builds) to a local
      # tarball — no push — then scan it so base-image CVEs are caught pre-merge,
      # not just at release time.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/img.tar
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Trivy image scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e GITHUB_TOKEN -v /tmp:/tmp \
            ghcr.io/aquasecurity/trivy:latest image --input /tmp/img.tar \
            --severity CRITICAL,HIGH --exit-code 0 --no-progress
