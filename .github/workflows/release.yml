name: Release

# Cuts a release from conventional commits on main: computes the next version,
# updates the changelog + version files, tags + publishes a GitHub Release, then
# builds and pushes the versioned container image.
on:
  push:
    branches: [main]

# Avoid overlapping release runs racing on the git tag / release commit.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create tags, push the release commit, create the GitHub Release
  issues: write # semantic-release may comment on issues/PRs
  pull-requests: write
  packages: write # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags so semantic-release can determine the version.
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The remaining steps run only when a new version was actually released.
      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v7
        with:
          context: frontend
          # Runner is amd64, matching the cluster — native build, no emulation.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/petzkod5/petzko-sh:${{ steps.semantic.outputs.new_release_version }}
            ghcr.io/petzkod5/petzko-sh:latest

      # Build the resume-proxy backend at the same version so the chart can
      # deploy both images on one tag.
      - name: Build and push backend image
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/petzkod5/petzko-sh-backend:${{ steps.semantic.outputs.new_release_version }}
            ghcr.io/petzkod5/petzko-sh-backend:latest

      # Scan the freshly published images; findings print to the run log.
      # Report-only (the release already shipped by this point).
      - name: Scan released images (Trivy)
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          for img in petzko-sh petzko-sh-backend; do
            echo "::group::trivy $img:$V"
            docker run --rm -e GITHUB_TOKEN \
              ghcr.io/aquasecurity/trivy:latest image \
              ghcr.io/petzkod5/$img:$V \
              --severity CRITICAL,HIGH --exit-code 0 --no-progress
            echo "::endgroup::"
          done
