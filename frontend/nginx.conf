# Server config for the static petzko.sh site (non-root nginx, port 8080).
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;

    # Hashed build assets — safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Self-hosted fonts (not content-hashed, so cache for a month rather than
    # "immutable"). Already woff2-compressed, so left out of gzip_types.
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Runtime config — written to a writable tmpfs at startup (the root FS is
    # read-only), and served from there. Never cached so per-deploy env changes
    # take effect.
    location = /config.js {
        alias /tmp/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
    }

    # Liveness/readiness probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA: serve the file if it exists, otherwise the app shell. No $uri/ test,
    # so paths that collide with asset dirs (e.g. /about) don't 301-redirect.
    location / {
        try_files $uri /index.html;
    }

    # The HTML entrypoint. All app/SPA routes resolve here (directly or via the
    # try_files fallback above), so the security headers live here. Not cached,
    # so deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/wasm;
}
