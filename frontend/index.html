<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="description" content="Dylan Petzko, DevOps engineer working on Kubernetes, platform engineering, and GitOps. Emotionally unavailable, but the uptime is great." />
    <link rel="canonical" href="https://petzko.sh/" />

    <!-- Open Graph (Slack / iMessage / Discord / Facebook link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="petzko.sh" />
    <meta property="og:url" content="https://petzko.sh/" />
    <meta property="og:title" content="Dylan Petzko · DevOps Engineer" />
    <meta property="og:description" content="Dylan Petzko, DevOps engineer working on Kubernetes, platform engineering, and GitOps. Emotionally unavailable, but the uptime is great." />
    <meta property="og:image" content="https://petzko.sh/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="petzko.sh — a green-phosphor CRT terminal portfolio" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dylan Petzko · DevOps Engineer" />
    <meta name="twitter:description" content="Dylan Petzko, DevOps engineer working on Kubernetes, platform engineering, and GitOps. Emotionally unavailable, but the uptime is great." />
    <meta name="twitter:image" content="https://petzko.sh/og-card.png" />

    <!-- Structured data (schema.org): ties the name to the socials for rich
         Google results / a Knowledge Panel. Lives in the static HTML so crawlers
         get it without running JS. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://petzko.sh/#person",
            "name": "Dylan Petzko",
            "url": "https://petzko.sh",
            "image": "https://petzko.sh/og-card.png",
            "jobTitle": "DevOps Engineer",
            "email": "mailto:dylan@petzko.sh",
            "sameAs": [
              "https://github.com/petzkod5",
              "https://linkedin.com/in/dylan-petzko",
              "https://instagram.com/dylanpetzko"
            ],
            "knowsAbout": [
              "DevOps",
              "Platform Engineering",
              "Kubernetes",
              "Talos",
              "GitOps",
              "Observability"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://petzko.sh/#website",
            "url": "https://petzko.sh",
            "name": "petzko.sh",
            "description": "Dylan Petzko's personal site — a green-phosphor CRT terminal portfolio.",
            "publisher": { "@id": "https://petzko.sh/#person" }
          }
        ]
      }
    </script>

    <title>Dylan Petzko · DevOps Engineer</title>
    <!-- Runtime config (window.__APP_ENV__); regenerated per-deploy in the
         container. Loads before the app bundle. -->
    <script src="/config.js"></script>

    <!-- Apply the saved CRT theme before first paint so there's no flash of the
         default palette. The theme list lives only in src/state/useTheme.ts
         (THEMES); this pre-paint script can't import it, so it just applies the
         stored value (or the green default). An unknown value falls back to the
         green :root palette in theme.css and is normalised on the first switch. -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('petzko:theme') || 'green'
      } catch (e) {
        document.documentElement.dataset.theme = 'green'
      }
    </script>
  </head>
  <body>
    <!-- The page heading for crawlers and screen readers. It sits outside #root
         so React never replaces it, and it stays the only H1 after the app renders. -->
    <h1 class="visually-hidden">Dylan Petzko</h1>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
