apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petzko-sh-prod
  # ArgoCD's install namespace on the target cluster.
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: git@github.com:petzkod5/petzko.sh.git
    targetRevision: main
    path: charts/petzko-sh
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: petzko-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
