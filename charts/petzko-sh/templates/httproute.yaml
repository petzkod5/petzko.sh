{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "petzko-sh.fullname" . }}
  labels:
    {{- include "petzko-sh.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      sectionName: {{ .Values.httpRoute.listenerName }}
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  rules:
    {{- if .Values.backend.enabled }}
    # /resume/* → resume-proxy backend (mirrors the latest resume release).
    # More specific than the catch-all below, so it wins regardless of order.
    - matches:
        - path:
            type: PathPrefix
            value: /resume/
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "petzko-sh.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}
          weight: 1
    {{- end }}
    # Everything else → static nginx SPA.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "petzko-sh.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
