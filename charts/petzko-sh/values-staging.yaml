# ── Staging overlay ───────────────────────────────────────────────────────────
# Internal-only: HTTP via the base Traefik service (.225) on the 'web' listener.
buildEnv: staging

image:
  # Auto-bumped to the latest release by semantic-release on each release
  # (see .releaserc.json). Immutable semver tag → no pull policy override needed.
  tag: "1.7.2"

httpRoute:
  hostname: petzko.home.local
  listenerName: web
