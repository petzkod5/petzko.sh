# ── petzko-sh base values ─────────────────────────────────────────────────────
# Shared defaults. Environment overlays (values-staging.yaml / values-prod.yaml)
# set the image tag, BUILD_ENV label, hostname, and Gateway listener.

replicaCount: 1

image:
  repository: ghcr.io/petzkod5/petzko-sh
  pullPolicy: IfNotPresent
  # Overridden per environment (and bumped per build).
  tag: latest

# Public image → no pull secret needed. Add one here if it ever goes private.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Written into /config.js at container start (shown as "Build:" in the UI).
buildEnv: dev

# Cluster identity, written into /config.js at container start — names the cluster
# serving this page (drives the ":system" / ":neofetch" "serving you" highlight,
# and reflects the active origin during a multi-cluster failover). Set per-cluster
# in the environment overlays.
clusterId: ""

# ── Telemetry collector ───────────────────────────────────────────────────────
# Optional pod that scrapes the in-cluster Prometheus and pushes a sanitized
# fleet snapshot to the petzko-edge Worker (powers the :system dashboard).
# Website-specific, so it lives here rather than the cluster repo. Enable in
# exactly ONE deployment per physical cluster (it reports a single cluster_id) —
# i.e. prod only on rivendell, since staging shares the same cluster.
collector:
  enabled: false
  image: python:3.14-slim
  # Live cadence — how often to scrape + push, in seconds.
  intervalSeconds: 5
  promUrl: http://kube-prometheus-stack-prometheus.monitoring:9090
  ingestUrl: https://petzko.sh/api/telemetry/ingest
  # Defaults to the top-level clusterId when empty.
  clusterId: ""
  role: primary
  # k8s Secret (key: token) holding the ingest bearer token — created out-of-band,
  # mirrors one entry in the Worker's TELEMETRY_TOKENS map.
  tokenSecretName: telemetry-collector
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Container listens on 8080 (non-root nginx); Service fronts it on 80.
containerPort: 8080

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# ── Resume-proxy backend ──────────────────────────────────────────────────────
# Tiny Go service that mirrors the latest release of the public resume repo and
# serves it same-origin under /resume/ (the browser can't fetch GitHub release
# assets directly — no CORS). Shares the release version tag with the frontend
# image (both are built together each release).
backend:
  enabled: true
  image:
    repository: ghcr.io/petzkod5/petzko-sh-backend
    # tag is taken from .Values.image.tag (same release version as the frontend).
  # GitHub repo + release asset names to mirror, and how long to cache each.
  resumeRepo: petzkod5/resume
  resumeAssets: resume-dark.pdf,resume-light.pdf
  cacheTtl: 5m
  containerPort: 8080
  service:
    port: 80
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 64Mi
  # Distroless nonroot (uid 65532); cache is in-memory so the root FS is read-only.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# ── HTTPRoute (Traefik Gateway API) ──────────────────────────────────────────
httpRoute:
  enabled: true
  # Set per environment.
  hostname: ""
  gateway:
    name: traefik-gateway
    namespace: traefik
  # Gateway listener (sectionName): 'web' (HTTP) for staging, 'websecure' (HTTPS)
  # for prod.
  listenerName: web

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 3
  periodSeconds: 10

podAnnotations: {}
podLabels: {}

# Matches the hardened image (non-root nginx, uid/gid 101).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # Root FS is read-only; nginx's writable paths (temp + the runtime config.js)
  # are emptyDir mounts (see deployment.yaml).
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
