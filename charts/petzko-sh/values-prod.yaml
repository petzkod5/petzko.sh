# ── Production overlay ─────────────────────────────────────────────────────────
# Public: HTTPS via the traefik-external service (.226) on the 'websecure'
# listener, using the petzko.sh wildcard cert already wired into that listener.
buildEnv: prod
# Served from the homelab cluster.
clusterId: rivendell

# Run the telemetry collector here (one per physical cluster; staging shares
# rivendell so it stays off there).
collector:
  enabled: true

image:
  # Promoted manually: bump this to the release you want live in prod, then
  # commit. (Not touched by semantic-release.)
  tag: "1.25.2"

# backend.enabled MUST move in lockstep with image.tag: the resume-proxy image
# only exists from v1.4.0 onward, and the frontend stopped baking the resume PDF
# in that same release. On >= 1.4.0 the backend serves /resume/; if it were off,
# prod's frontend would have no PDF and no backend. (On <= 1.3.x it must be off,
# since there's no backend image and the baked PDF serves /resume/ via nginx.)
backend:
  enabled: true

httpRoute:
  hostname: petzko.sh
  listenerName: websecure
